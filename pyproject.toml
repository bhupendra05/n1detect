[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n1detect"
version = "0.1.0"
description = "Detect N+1 SQL query patterns in Django, SQLAlchemy, or any DB-API 2.0 app"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["n+1", "orm", "sql", "django", "sqlalchemy", "performance", "database", "query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
sqlalchemy = ["sqlalchemy>=1.4"]
django = ["django>=3.2"]

[project.scripts]
n1detect = "n1detect.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["n1detect*"]
